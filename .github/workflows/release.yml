name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BINARY_NAME: kyomi-connect
  GHCR_REGISTRY: ghcr.io/kyomi-ai

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-linux-amd64:
    needs: [prepare]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release -p kyomi-connect

      - name: Rename binary
        run: mv target/release/${{ env.BINARY_NAME }} kyomi-connect-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyomi-connect-linux-amd64
          path: kyomi-connect-linux-amd64

  build-linux-arm64:
    needs: [prepare]
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release -p kyomi-connect

      - name: Rename binary
        run: mv target/release/${{ env.BINARY_NAME }} kyomi-connect-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyomi-connect-linux-arm64
          path: kyomi-connect-linux-arm64

  build-macos-arm64:
    needs: [prepare]
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release -p kyomi-connect

      - name: Rename binary
        run: mv target/release/${{ env.BINARY_NAME }} kyomi-connect-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyomi-connect-macos-arm64
          path: kyomi-connect-macos-arm64

  build-macos-amd64:
    needs: [prepare]
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable with x86_64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary (cross-compile for Intel)
        run: cargo build --release -p kyomi-connect --target x86_64-apple-darwin

      - name: Rename binary
        run: mv target/x86_64-apple-darwin/release/${{ env.BINARY_NAME }} kyomi-connect-macos-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyomi-connect-macos-amd64
          path: kyomi-connect-macos-amd64

  publish-crates:
    needs: [build-linux-amd64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Get crates.io publish token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish kyomi-connect-protocol
        run: cargo publish -p kyomi-connect-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish kyomi-datasource
        run: cargo publish -p kyomi-datasource
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish kyomi-connect
        run: cargo publish -p kyomi-connect
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release:
    needs: [build-linux-amd64, build-linux-arm64, build-macos-arm64, build-macos-amd64, publish-crates]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          for f in kyomi-connect-*; do sha256sum "$f" > "$f.sha256"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: kyomi-connect-*

  docker:
    needs: [prepare, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.GHCR_REGISTRY }}/kyomi-connect:${{ needs.prepare.outputs.version }} \
            -t ${{ env.GHCR_REGISTRY }}/kyomi-connect:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.GHCR_REGISTRY }}/kyomi-connect:${{ needs.prepare.outputs.version }}
          docker push ${{ env.GHCR_REGISTRY }}/kyomi-connect:latest

  helm:
    needs: [prepare, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package charts/kyomi-connect \
            --version ${{ needs.prepare.outputs.version }} \
            --app-version ${{ needs.prepare.outputs.version }}

      - name: Push Helm chart
        run: helm push kyomi-connect-${{ needs.prepare.outputs.version }}.tgz oci://${{ env.GHCR_REGISTRY }}/charts
