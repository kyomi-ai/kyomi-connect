name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -p kyomi-connect -p kyomi-connect-protocol -p kyomi-datasource -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace -- -D warnings

  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit locked dependencies against current advisories
        run: cargo audit

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Native ClickHouse transport TLS tests
        run: cargo test --locked -p kyomi-datasource --features datafusion-providers --lib native_tunnel

  feature-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - postgres
          - mysql
          - clickhouse
          - snowflake
          - bigquery
          - sqlserver
          - databricks
          - synapse
          - redshift
          - postgres,ssh
          - synapse,ssh
          - datafusion-providers,ssh
          - all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check feature ${{ matrix.feature }}
        run: cargo check --locked -p kyomi-datasource --no-default-features --features ${{ matrix.feature }}

  windows-feature-check:
    runs-on: windows-latest
    strategy:
      matrix:
        args: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile portable datasource features
        run: cargo check --locked -p kyomi-datasource ${{ matrix.args }}
