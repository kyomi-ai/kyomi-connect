[package]
name = "kyomi-connect"
version = "1.0.3"
edition = "2024"
description = "On-premise database agent for Kyomi — connects your data warehouse securely"
license = "Apache-2.0"
repository = "https://github.com/kyomi-ai/kyomi-connect"
homepage = "https://kyomi.ai"

[[bin]]
name = "kyomi-connect"
path = "src/main.rs"

[dependencies]
kyomi-connect-protocol = { workspace = true }
kyomi-datasource = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
toml = "0.8"
dirs = "6"
libc = "0.2"
open = "5"
rand = { workspace = true }
arrow = { workspace = true }
tower-http = { workspace = true }
