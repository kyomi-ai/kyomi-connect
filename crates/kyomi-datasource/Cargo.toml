[package]
name = "kyomi-datasource"
version = "1.0.3"
edition = "2024"
description = "Database provider implementations for Kyomi Connect"
license = "Apache-2.0"
repository = "https://github.com/kyomi-ai/kyomi-connect"
homepage = "https://kyomi.ai"

[features]
default = ["all"]
all = ["postgres", "mysql", "redshift", "clickhouse", "snowflake",
       "databricks", "sqlserver", "synapse", "bigquery"]
postgres = ["dep:sqlx"]
mysql = ["dep:sqlx"]
redshift = ["dep:sqlx", "postgres"]
clickhouse = []
snowflake = ["dep:jsonwebtoken", "dep:rsa"]
databricks = []
sqlserver = ["dep:tiberius", "dep:tokio-util"]
synapse = ["dep:tiberius", "dep:tokio-util"]
bigquery = ["dep:jsonwebtoken"]
ssh = ["dep:russh"]

[dependencies]
kyomi-connect-protocol = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }

# Database drivers (optional, feature-gated)
sqlx = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
russh = { workspace = true, optional = true }

# Auth (optional)
jsonwebtoken = { workspace = true, optional = true }
base64 = { workspace = true }
rsa = { workspace = true, optional = true }

# Type support
rust_decimal = { workspace = true }
hex = { workspace = true }

# AWS Signature V4 (for Redshift IAM)
hmac = { workspace = true }
sha2 = { workspace = true }

# Error parsing
regex = { workspace = true }

[dev-dependencies]
# HTTP mock server for testing OAuth token exchange
wiremock = "0.6"
