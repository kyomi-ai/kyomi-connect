[workspace]
members = [
    "crates/kyomi-connect",
    "crates/kyomi-connect-protocol",
    "crates/kyomi-datasource",
]
resolver = "3"

# Shared dependency versions — all crates use these
[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "limit", "normalize-path", "set-header", "trace"] }

# Database drivers (optional, feature-gated)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "uuid", "chrono", "json", "macros", "rust_decimal"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / Crypto
jsonwebtoken = "9"
base64 = "0.22"
rsa = { version = "0.9", features = ["pkcs5"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }

# SSH tunneling.
# Pinned to 0.54.x deliberately — do NOT bump to >=0.55 without checking the
# downstream `kyomi` app. russh 0.55 switched its crypto stack to the
# pre-release RustCrypto generation (generic-array 1.x, rsa 0.10-rc), which is
# mutually unsatisfiable with `webauthn-rs`/`crypto-glue` (generic-array
# =0.14.7, rsa 0.9) that kyomi pulls in for passkeys — so >=0.55 makes the
# `ssh` feature un-resolvable in kyomi's binary (direct-path SSH tunnel).
# 0.54.x still uses the stable generation and coexists. (0.54.6 is skipped
# automatically — it has a yanked libcrux-ml-kem dep; cargo resolves 0.54.5.)
# Revisit when crypto-glue moves to the stable rsa 0.10 / generic-array 1.x.
russh = "0.54"

# Type support
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing (AWS Signature V4 for Redshift IAM)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Error parsing
regex = "1"

# URL encoding
percent-encoding = "2"

# Arrow (columnar data format)
arrow = { version = "57", default-features = false, features = ["ipc"] }
arrow-flight = { version = "57", default-features = false, features = ["flight-sql-experimental"] }
arrow-ipc = { version = "57", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }

# DataFusion (universal query engine, optional for adapter pattern)
datafusion = { version = "52", default-features = false, features = ["sql"] }
clickhouse = { version = "0.13", default-features = false }

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
futures-util = "0.3"
rand = "0.9"
http = "1"

# Internal crates
kyomi-connect-protocol = { version = "1.3.0", path = "crates/kyomi-connect-protocol" }
kyomi-datasource = { version = "1.6.0", path = "crates/kyomi-datasource" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
