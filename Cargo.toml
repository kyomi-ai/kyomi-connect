[workspace]
members = [
    "crates/kyomi-connect",
    "crates/kyomi-connect-protocol",
    "crates/kyomi-datasource",
]
resolver = "3"

# Shared dependency versions — all crates use these
[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "limit", "normalize-path", "set-header", "trace"] }

# Database drivers (optional, feature-gated)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "uuid", "chrono", "json", "macros", "rust_decimal"] }
tiberius = { package = "tiberius-ng", version = "0.13", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / Crypto
jsonwebtoken = "9"
base64 = "0.22"
rsa = { version = "0.9", features = ["pkcs5"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }

# SSH tunneling.
#
# Pinned to 0.54.x deliberately — do NOT bump without re-running the resolution
# test below. Bumping makes the `ssh` feature un-resolvable in the downstream
# `kyomi` app, which pulls in `webauthn-rs` -> `crypto-glue` for passkeys.
#
# The conflict is `hmac` and `sha2`, NOT generic-array/rsa as this comment
# previously claimed. Both crates want the *same* minor version of each, but
# from opposite sides of the RustCrypto pre-release boundary — and a
# pre-release and its final release share one semver slot, so cargo cannot
# select both:
#
#   crate          crypto-glue 0.1.17   russh >= 0.60.3   coexist?
#   hmac           ^0.13.0-rc.5         ^0.13.0           no  — one 0.13 slot
#   sha2           ^0.11.0-rc.5         ^0.11.0           no  — one 0.11 slot
#   generic-array  =0.14.7              ^1.3.3            yes — distinct majors
#   rsa            ^0.9.10              =0.10.0-rc.16     yes — distinct majors
#
# Note the direction: it is `crypto-glue` that sits on the pre-release
# generation, and russh that moved to the stable one. Verified empirically on
# 2026-07-25 against 0.60.3, 0.61 and 0.62 — all three fail to resolve, first
# on hmac and then on sha2 once hmac is forced. generic-array and rsa resolve
# cleanly in every case, so they were never the blocker.
#
# This blocks two high RUSTSEC advisories (2026-0154 russh, 2026-0153
# russh-cryptovec, both patched in >= 0.60.3) and a rustc
# future-incompatibility warning, so it is worth re-checking periodically.
#
# Revisit when crypto-glue moves onto the *stable* hmac 0.13 / sha2 0.11
# releases. Re-test by pointing this at "0.60.3" and running
# `cargo check --workspace` in a kyomi checkout patched at this one.
#
# (0.54.6 is skipped automatically — it has a yanked libcrux-ml-kem dep;
# cargo resolves 0.54.5.)
russh = "0.54"

# Type support
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing (AWS Signature V4 for Redshift IAM)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Error parsing
regex = "1"

# URL encoding
percent-encoding = "2"

# Arrow (columnar data format)
arrow = { version = "57", default-features = false, features = ["ipc"] }
arrow-flight = { version = "57", default-features = false, features = ["flight-sql-experimental"] }
arrow-ipc = { version = "57", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }

# DataFusion (universal query engine, optional for adapter pattern)
datafusion = { version = "52", default-features = false, features = ["sql"] }
clickhouse = { version = "0.13", default-features = false }

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
futures-util = "0.3"
rand = "0.9"
http = "1"

# Internal crates
kyomi-connect-protocol = { version = "1.4.1", path = "crates/kyomi-connect-protocol" }
kyomi-datasource = { version = "1.6.0", path = "crates/kyomi-datasource" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
